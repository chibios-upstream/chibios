# STM32H755 dual-core RT/XHAL demo pair, using the board's STLINK-V3.
# Direct DAP access is required to expose both cores.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# These settings must precede the target script.
set DUAL_CORE 1
set DUAL_BANK 1
source [find target/stm32h7x.cfg]

reset_config srst_only srst_nogate
adapter speed 1800

# Default GDB ports: 3333 for M7 (cpu0), 3334 for M4 (cpu1).
